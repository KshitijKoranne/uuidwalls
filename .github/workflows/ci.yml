name: CI

on:
  pull_request:
  push:
    branches: [redesign/v2]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values: CI never talks to Supabase or Razorpay and holds no secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-key
      RAZORPAY_KEY_ID: rzp_test_dummy
      RAZORPAY_KEY_SECRET: dummy-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Golden determinism tests (v2 engine must equal v1)
        run: npm test
      - run: npm run build
      - name: Browser tests (worker parity, cancel race, app flows)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
